title: Mark Crossfield
description: Writings about software development, DevOps and technology
name: Mark Crossfield
author: mrmanc
url: http://markcrossfield.co.uk/
highlighter: rouge
paginate: 10
permalink: /:year-:month-:day-:title.html
twitter:
  username: mrmanc
logo: /images/logo.png

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - compose.yml
  - CNAME
  - .ruby-version
  - LICENSE
  - README.md